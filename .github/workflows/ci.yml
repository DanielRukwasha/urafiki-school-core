name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urafiki
          POSTGRES_PASSWORD: urafiki
          POSTGRES_DB: urafiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://urafiki:urafiki@localhost:5432/urafiki_test
      TEST_DATABASE_URL: postgresql+psycopg://urafiki:urafiki@localhost:5432/urafiki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-ops.txt
      - name: Lint
        run: ruff check .
      - name: Compile translation catalogs
        run: pybabel compile -d app/translations
      - name: Apply migrations against PostgreSQL
        run: flask --app wsgi.py db upgrade
      - name: Check migrations are reversible against PostgreSQL
        run: |
          flask --app wsgi.py db downgrade 14efd3eb110e
          flask --app wsgi.py db upgrade
      # Same command as a local `pytest`: the default tier excludes the
      # browser/pdf/sauvegarde tiers (pyproject.toml), which run below.
      - name: Run tests against PostgreSQL
        run: pytest -ra --cov=app --cov-report=term-missing
  browser-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser and PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          pip install -r requirements-browser.txt -r requirements-pdf.txt
          python -m playwright install --with-deps chromium
      # A missing system dependency fails this step explicitly (tier check
      # in tests/conftest.py) — nothing in this tier can be silently skipped.
      - name: Exercise browser workflows and native A4 rendering
        run: pytest -m "browser or pdf" -ra
      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-visual-review
          path: tmp/portal-review/


  sauvegarde-restauration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: urafiki
          POSTGRES_PASSWORD: urafiki
          POSTGRES_DB: urafiki_sauvegarde
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: development
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://urafiki:urafiki@localhost:5432/urafiki_sauvegarde
      SAUVEGARDE_DATABASE_URL: postgresql+psycopg://urafiki:urafiki@localhost:5432/urafiki_sauvegarde
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PostgreSQL 16 client tools and GnuPG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 gnupg
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-ops.txt
      - name: Build a populated database (migrations + one fictitious tenant)
        run: |
          flask --app wsgi.py db upgrade
          flask --app wsgi.py tenant create --name "École Fictive CI" --short-code CI             --domain ci.example.test --direction-email direction@ci.example.test             --direction-first-name CI --direction-last-name Direction             --academic-year-label 2025-2026 --academic-year-start 2025-09-01             --academic-year-end 2026-06-30 > /dev/null
      - name: Backup, encrypt, store, restore and compare
        run: pytest -m sauvegarde -ra
