{% extends "base.html" %}
{% block title %}{{ _("Années académiques") }}{% endblock %}
{% block content %}
<h1>{{ _("Années académiques") }}</h1>
<ul>
  {% for year in years %}
    <li>{{ year.label }} {% if year.is_current %}{{ _("(en cours)") }}{% endif %}</li>
  {% endfor %}
</ul>
{% endblock %}
