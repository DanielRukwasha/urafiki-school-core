[project]
name = "urafiki-school-core"
version = "0.1.0"
description = "Core reusable backend for the Urafiki school management platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default run = CI's `test` job. The browser/pdf tiers need system
# dependencies and run with: pytest -m "browser or pdf" (see README.md).
addopts = "-m 'not browser and not pdf and not sauvegarde'"
markers = [
    "browser: real-browser tests (Playwright + Chromium); CI job browser-pdf",
    "pdf: native PDF rendering tests (WeasyPrint + Pango); CI job browser-pdf",
    "sauvegarde: backup/restore cycle (PostgreSQL, pg_dump, gpg); CI job sauvegarde-restauration",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/config.py", "app/blueprints/*/forms.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
